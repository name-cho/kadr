name: Release
on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  get_tag:
    name: Extract tag name
    runs-on: 'ubuntu-26.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    name: Build
    runs-on: 'ubuntu-26.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # release signing uses the debug keystore unless MIHON_GITHUB_RELEASE + keystore env is set
      - name: Build
        run: ./gradlew assembleRelease -Pdist=github
        env:
          MIHON_GITHUB_RELEASE: false

      - name: Rename APK
        run: |
          set -e
          TAG=${{ needs.get_tag.outputs.tag }}
          mv app/build/outputs/apk/release/app-universal-release.apk kadr-$TAG.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk kadr-arm64-v8a-$TAG.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk kadr-armeabi-v7a-$TAG.apk
          mv app/build/outputs/apk/release/app-x86-release.apk kadr-x86-$TAG.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk kadr-x86_64-$TAG.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kadr
          path: |
            kadr-${{ needs.get_tag.outputs.tag }}.apk
            kadr-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            kadr-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            kadr-x86-${{ needs.get_tag.outputs.tag }}.apk
            kadr-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: [get_tag, build]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: kadr

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Kadr ${{ needs.get_tag.outputs.tag }}
          body: |
            <!-->

            [!TIP]
            If you are unsure which version to download then go with `kadr-${{ needs.get_tag.outputs.tag }}.apk`
          files: |
            kadr-${{ needs.get_tag.outputs.tag }}.apk
            kadr-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            kadr-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            kadr-x86-${{ needs.get_tag.outputs.tag }}.apk
            kadr-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: true
          prerelease: false
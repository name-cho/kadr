# GitLab CI for Kadr (gitgud.io/name-cho/kadr)
# Builds a release APK on tags and keeps it as a CI artifact.

image: eclipse-temurin:21-jdk

stages:
  - build

variables:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  ANDROID_HOME: "/opt/android-sdk"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches
    - .gradle/wrapper

release:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends curl unzip
    - |
      if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl -sSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi
    - export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;36.0.0"
    - ./gradlew assembleRelease -Pdist=ci
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 90 days
